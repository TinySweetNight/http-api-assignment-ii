<!DOCTYPE html>
<html lang="en">
<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
  
  <script>

    const handleResponse = async (response) => {
      const content = document.querySelector('#content');

      switch(response.status) {
        case 200:
          content.innerHTML = `<b>Success</b>`;
          break;
        case 201:
          content.innerHTML = `<b>Created</b>`;
          break;
        case 204:
          content.innerHTML = `<b>Updated (No Content)</b>`;
          break;
        case 400:
          content.innerHTML = `<b>Bad Request</b>`;
          break;
        case 404:
          content.innerHTML = `<b>Not Found</b>`;
          break;
        default:
          content.innerHTML = `<b>Not Found</b>`;
     }

     
      response.text().then((resText) => {
        const contentType = response.headers.get('Content-Type');

        console.log(resText);

          //Parse the json back into a javascript object, and display the data.
          let parsedResponse = JSON.parse(resText);
          parsedResponse = JSON.stringify(parsedResponse);
          content.innerHTML += `<p>Message: ${parsedResponse.message}</p>`;
      });
   
      
    };

    const sendFetch = async (url, methods) => {
       const options = {
        method: methods,
        headers: {'Accept': 'application/json'},
      }
      console.log(methods);
      fetch(url,options).then((response)=>console.log(response));
      fetch(url,options).then((response)=> {handleResponse(response)});
    };

    var url;
    var methods;

    const init = () =>{
      const submitButton = document.getElementById('grabUser');
       const userForm = document.querySelector('#userForm');

        url =  document.getElementById("urlField").value;
        methods =  document.getElementById("methodSelect").value;

      document.getElementById("urlField").addEventListener("change", function () {
        url = this.value;});

      document.getElementById("methodSelect").addEventListener("change", function () {
        methods = this.value;});

        console.log(url);
        console.log(methods);

      submitButton.addEventListener('click', () => sendFetch(url, methods));
    }

    window.onload = init;

  </script>
</head>
<body>
  <section id="top">
    <h3>POST Status Code Tests</h3>
    <form id="nameForm" action="/addUser" method="post">
      <label for="name">Name: </label>
      <input id="nameField" type="text" name="name" />
      <label for="age">Age: </label>
      <input id="ageField" type="number" name="age" min="0" max="100" step="1"/>
      <input type="submit" value="Add User" />
    </form>
    <form id="userForm" action="/getUsers" method="get">
      <select id='urlField'>
        <option value='/getUsers'>/getUsers</option>
        <option value='/notReal'>/notReal</option>
      </select>
      <select id="methodSelect">
        <option value="get">GET</option>
        <option value="head">HEAD</option>
      </select>
      <input type="submit" value="Get User" id="grabUser" />
    </form>
  </section>
  <section id="content">
  </section>
</body>
</html>
